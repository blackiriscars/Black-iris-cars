name: Fleet Check (30m)

on:
  schedule:
    # Runs at minute 0 and minute 30 of every hour
    - cron: '0,30 * * * *'
  workflow_dispatch: 

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Tools
        run: npm install

      - name: Run Script
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: node daily-check.js