name: Hourly Fleet Check

on:
  schedule:
    # Runs at minute 0 of every hour (00:00, 01:00, 02:00...)
    - cron: '0 * * * *'
  workflow_dispatch: 

jobs:
  run-hourly-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Tools
        run: npm install

      - name: Run Script
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: node daily-check.js