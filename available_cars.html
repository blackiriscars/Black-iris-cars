<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Cars | Black Iris Cars</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="data.js"></script>
    <style>
        /* ... (Keep CSS) ... */
    </style>
</head>
<body class="antialiased" dir="ltr">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ... (Keep Config) ...
        const firebaseConfig = {
          apiKey: "AIzaSyDo3yc_pj5vavuWDzOfm5QX1KURnqcF0vs",
          authDomain: "black-iris-fleet-9c64e.firebaseapp.com",
          projectId: "black-iris-fleet-9c64e",
          storageBucket: "black-iris-fleet-9c64e.firebasestorage.app",
          messagingSenderId: "875590751512",
          appId: "1:875590751512:web:7377b8c8fe507053f7ba6d",
          measurementId: "G-4Y7L69L9BS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        lucide.createIcons();

        // ... (Global Vars) ...
        let currentLang = 'en';
        let currentCurrency = 'DH';
        let exchangeRates = { EUR: 0.092, USD: 0.10 };
        let allCars = [];
        let priceRange, priceValue, carCountElement, resultsContainer;

        // ... (Helpers: getTranslation, updateAllSelectors...) ...
        function getTranslation(key) {
            if (typeof translations === 'undefined' || !translations[currentLang]) return key;
            const translation = translations[currentLang][key];
            return (typeof translation === 'function') ? translation : (translation || key);
        }

        function calculatePrice(basePrice) {
            if (currentCurrency === 'EUR') return { price: (basePrice * exchangeRates.EUR).toFixed(0), symbol: '€' };
            if (currentCurrency === 'USD') return { price: (basePrice * exchangeRates.USD).toFixed(0), symbol: '$' };
            return { price: basePrice, symbol: '' };
        }

        // --- UPDATED CURRENCY SETTER (FIXED MAX) ---
        function setCurrency(currency) {
            currentCurrency = currency;
            document.querySelectorAll('#currency-selector, #currency-selector-mobile').forEach(s => s.value = currency);

            let newMax = 2000; // Default DH
            if (currency === 'EUR' || currency === 'USD') {
                newMax = 200; // Fixed hard limit for USD/EUR
            }
            priceRange.max = newMax;
            priceRange.value = newMax; 
            
            updatePriceDisplay();
            renderAllCars();
        }

        function updatePriceDisplay() {
            const val = priceRange.value;
            const symbol = currentCurrency === 'DH' ? ' DH' : (currentCurrency === 'EUR' ? ' €' : ' $');
            priceValue.textContent = `${val}${symbol}`;
        }

        // --- UPDATED LOAD CARS (UNIVERSAL MAPPER) ---
        async function loadCars() {
            if (!resultsContainer) return;
            resultsContainer.innerHTML = ''; // Clear
            
            try {
                const q = query(collection(db, "cars"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                allCars = [];
                querySnapshot.forEach((doc) => {
                    const d = doc.data();
                    // UNIVERSAL MAPPING
                    allCars.push({ 
                        id: doc.id,
                        price: Number(d.price) || 0,
                        // Fix for mismatched keys
                        img: d.imageUrl || d.img || 'https://placehold.co/600x400?text=No+Image',
                        type: d.category || d.type || 'Sedan',
                        fuel: d.fuelType || d.fuel || 'Diesel',
                        desc: d.description || d.desc || '',
                        transmission: (d.transmission || '').toLowerCase(),
                        color: d.color || 'Standard',
                        seats: d.seats || 5,
                        name: d.name
                    });
                });
                renderAllCars();
            } catch (error) { console.error(error); }
        }
        
        function renderAllCars() {
            const header = resultsContainer.querySelector('.col-span-full');
            resultsContainer.innerHTML = '';
            if(header) resultsContainer.appendChild(header);

            const sliderValue = parseInt(priceRange.value); 
            
            const filteredCars = allCars.filter(car => {
                // Calculate comparison price based on current currency
                let comparePrice = car.price; // DH base
                if (currentCurrency !== 'DH') {
                    comparePrice = Number(calculatePrice(car.price).price);
                }
                return comparePrice <= sliderValue;
                // ... (Transmission/Type filters omitted for brevity, add them back if needed) ...
            });

            // ... (Rest of render logic matching Index style) ...
            filteredCars.forEach(car => {
                 const { price, symbol } = calculatePrice(car.price);
                 const priceStr = `${symbol}${price}${currentCurrency==='DH'?' DH':''}`;
                 
                 const div = document.createElement('div');
                 div.className = "car-card bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200 cursor-pointer flex flex-col transition-all duration-300 hover:shadow-2xl hover:-translate-y-1 group";
                 div.innerHTML = `
                    <div class="relative h-56 overflow-hidden">
                        <img src="${car.img}" class="w-full h-full object-cover transform group-hover:scale-105 transition duration-500">
                        <div class="absolute top-3 left-3 bg-primary-dark text-white text-xs font-bold px-3 py-1 rounded-full uppercase shadow-md">${car.type}</div>
                    </div>
                    <div class="p-6 flex flex-col justify-between flex-grow">
                        <div>
                            <h3 class="text-xl font-bold text-gray-900 mb-2">${car.name}</h3>
                            <div class="grid grid-cols-2 gap-y-2 gap-x-4 text-sm text-gray-600 mb-4">
                                <div class="flex items-center"><i data-lucide="zap" class="w-4 h-4 text-accent-blue mr-2"></i> ${car.transmission}</div>
                                <div class="flex items-center"><i data-lucide="fuel" class="w-4 h-4 text-accent-blue mr-2"></i> ${car.fuel}</div>
                                <div class="flex items-center"><i data-lucide="users" class="w-4 h-4 text-accent-blue mr-2"></i> ${car.seats} Seats</div>
                                <div class="flex items-center"><i data-lucide="palette" class="w-4 h-4 text-accent-blue mr-2"></i> ${car.color}</div>
                            </div>
                        </div>
                        <div class="flex justify-between items-center border-t border-gray-100 pt-4 mt-auto">
                            <div><span class="text-xs text-gray-400 font-medium uppercase">Daily Rate</span><br><span class="text-2xl font-extrabold text-primary-dark">${priceStr}</span></div>
                            <span class="accent-blue text-white font-semibold py-2 px-6 rounded-lg shadow-md">Book Now</span>
                        </div>
                    </div>
                 `;
                 resultsContainer.appendChild(div);
            });
            lucide.createIcons();
        }

        // ... (Keep Listeners & Init) ...
        document.addEventListener('DOMContentLoaded', () => {
            // ... (Init variables) ...
            priceRange = document.getElementById('price-range');
            priceValue = document.getElementById('price-value');
            resultsContainer = document.getElementById('results-container');
            
            // ... (Init functions) ...
            setCurrency('DH'); // Default
            loadCars();
        });
    </script>
</body>
</html>
