<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Cars | Black Iris Cars</title>
    <meta name="description" content="View our full fleet of available rental cars in Morocco.">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="data.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f9; transition: all 0.3s ease; }
        .primary-dark { background-color: #1a1a1a; } 
        .text-primary-dark { color: #1a1a1a; } 
        .accent-blue { background-color: #4169e1; } 
        .hover\:accent-blue-dark:hover { background-color: #2b4daa; } 
        .text-accent-blue { color: #4169e1; }

        #filter-sidebar { transition: transform 0.3s ease-in-out; transform: translateX(-100%); }
        #filter-sidebar.open { transform: translateX(0); }
        [dir="rtl"] #filter-sidebar { transform: translateX(100%); left: auto; right: 0; }
        [dir="rtl"] #filter-sidebar.open { transform: translateX(0); }
        
        input[type="checkbox"]:checked { background-color: #1a1a1a; border-color: #1a1a1a; }
        .compact-select { font-size: 0.875rem; font-weight: 600; color: #1a1a1a; background-color: transparent; border: 1px solid #d1d5db; border-radius: 0.375rem; padding: 8px 12px; margin: 0; cursor: pointer; appearance: none; }
        
        #results-container { display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 1.5rem; }
        @media (min-width: 768px) { #results-container { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (min-width: 1024px) { #results-container { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #3498db; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased" dir="ltr">

    <header class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="index.html" class="flex items-center">
                    <img src="https://i.postimg.cc/B6LWwXNL/923d79fe-5117-4849-9761-57e1fe5a8d96.jpg" alt="Logo" class="w-10 h-10 mr-2 rounded-full border border-gray-100">
                    <span class="text-2xl font-extrabold text-primary-dark">BLACK IRIS cars</span>
                </a>
                <div class="flex items-center space-x-3 sm:space-x-4">
                    <div class="hidden md:flex items-center space-x-3 border-r border-gray-200 pr-3 sm:pr-4">
                        <select id="currency-selector" class="compact-select"><option value="DH">DH</option><option value="EUR">EUR</option><option value="USD">USD</option></select>
                        <select id="language-selector" class="compact-select"><option value="en">EN</option><option value="fr">FR</option><option value="ar">AR</option></select>
                    </div>
                    <nav class="hidden md:flex md:ltr:space-x-8">
                        <a href="index.html#featured" class="text-gray-600 hover:text-accent-blue transition" data-i18n="nav-fleet">Our Fleet</a>
                        <a href="index.html#contact" class="text-gray-600 hover:text-accent-blue transition" data-i18n="nav-contact">Contact</a>
                    </nav>
                    <button id="filter-menu-button" class="md:hidden text-gray-600 hover:text-accent-blue p-2 rounded-lg transition"><i data-lucide="filter" class="w-6 h-6"></i></button>
                    <button id="mobile-menu-button" class="md:hidden text-gray-600 hover:text-accent-blue p-2 rounded-lg transition"><i data-lucide="menu" class="w-6 h-6"></i></button>
                </div>
            </div>
        </div>
        <div id="mobile-menu" class="md:hidden bg-white border-t border-gray-100 opacity-0 -translate-y-2 transform transition-all duration-300 ease-out fixed top-16 left-0 right-0 z-40" style="pointer-events: none;">
            <div class="px-4 pt-4 pb-3 space-y-4">
                <div class="flex items-center space-x-4">
                    <select id="currency-selector-mobile" class="compact-select w-full"><option value="DH">DH</option><option value="EUR">EUR</option><option value="USD">USD</option></select>
                    <select id="language-selector-mobile" class="compact-select w-full"><option value="en">EN</option><option value="fr">Français</option><option value="ar">العربية</option></select>
                </div>
                <div class="space-y-1">
                    <a href="index.html#featured" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:bg-gray-50 hover:text-accent-blue" data-i18n="nav-fleet">Our Fleet</a>
                    <a href="index.html#contact" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:bg-gray-50 hover:text-accent-blue" data-i18n="nav-contact">Contact</a>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-primary-dark mb-4" data-i18n="h1-available">Available Rental Cars</h1>
        
        <div id="filter-backdrop" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden md:hidden"></div>
        
        <div class="md:grid md:grid-cols-4 lg:grid-cols-5 md:gap-8">
            <div id="filter-sidebar" class="fixed top-0 left-0 h-full w-3/4 max-w-xs md:max-w-none bg-white p-6 shadow-2xl z-40 md:relative md:col-span-1 lg:col-span-1 md:h-auto md:p-0 md:shadow-none md:bg-transparent md:transform-none">
                <button id="filter-close-button" class="md:hidden absolute top-4 right-4 text-gray-800 hover:text-gray-600"><i data-lucide="x" class="w-6 h-6"></i></button>
                <h3 class="text-2xl font-bold text-primary-dark mb-6 border-b pb-3" data-i18n="h3-filter">Filter Options</h3>
                <form id="filter-form" class="space-y-6">
                    <div>
                        <label for="price-range" class="block text-sm font-semibold text-gray-700 mb-2" data-i18n="label-price">Price Range</label>
                        <input type="range" id="price-range" min="0" max="2000" value="2000" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer text-primary-dark">
                        <span id="price-value" class="text-lg font-bold text-gray-800 mt-1 block">2000 DH</span> 
                    </div>
                    <div>
                        <p class="text-sm font-semibold text-gray-700 mb-2">Transmission</p>
                        <div class="space-y-2" id="transmission-filters">
                            <label class="flex items-center text-gray-600 ltr:justify-start"><input type="checkbox" name="transmission" value="Automatic" class="rounded text-primary-dark ltr:mr-2"> <span data-i18n="automatic">Automatic</span></label>
                            <label class="flex items-center text-gray-600 ltr:justify-start"><input type="checkbox" name="transmission" value="Manual" class="rounded text-primary-dark ltr:mr-2"> <span data-i18n="manual">Manual</span></label>
                        </div>
                    </div>
                    <div>
                        <p class="text-sm font-semibold text-gray-700 mb-2">Fuel Type</p>
                        <div class="space-y-2" id="fuel-filters">
                            <label class="flex items-center text-gray-600 ltr:justify-start"><input type="checkbox" name="fuel" value="Diesel" class="rounded text-primary-dark ltr:mr-2"> Diesel</label>
                            <label class="flex items-center text-gray-600 ltr:justify-start"><input type="checkbox" name="fuel" value="Petrol" class="rounded text-primary-dark ltr:mr-2"> Essence</label>
                            <label class="flex items-center text-gray-600 ltr:justify-start"><input type="checkbox" name="fuel" value="Hybrid" class="rounded text-primary-dark ltr:mr-2"> Hybrid</label>
                        </div>
                    </div>
                    <button type="button" id="apply-filters-btn" class="w-full accent-blue text-white font-semibold py-2 rounded-lg hover:accent-blue-dark transition shadow-md mt-4">Apply Filters</button>
                </form>
            </div>

            <div id="results-container">
                <div class="col-span-full flex justify-between items-center bg-white p-3 rounded-lg shadow-sm border border-gray-100 mb-4">
                    <p class="text-sm text-gray-600" id="car-count">Loading cars...</p> 
                </div>
            </div>
        </div>
    </main>

    <div id="car-detail-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center hidden">
        <div class="bg-white p-6 sm:p-8 rounded-xl shadow-2xl w-full max-w-lg m-4 transform transition-all duration-300 scale-95 opacity-0" id="modal-detail-content">
            <div class="flex justify-between items-start mb-4">
                <h3 id="modal-car-name" class="text-2xl font-bold text-primary-dark">Car Name</h3>
                <button id="close-detail-modal-btn" class="text-gray-500 hover:text-primary-dark"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="space-y-4">
                <img id="modal-car-image" src="" alt="Car" class="w-full h-48 object-cover rounded-lg mb-4 border border-gray-200">
                <div class="grid grid-cols-2 gap-4 text-sm text-gray-700">
                    <div class="flex items-center ltr:justify-start"><i data-lucide="car" class="w-4 h-4 ltr:mr-2 text-accent-blue"></i> <span id="modal-transmission" class="font-semibold"></span></div>
                    <div class="flex items-center ltr:justify-start"><i data-lucide="users" class="w-4 h-4 ltr:mr-2 text-accent-blue"></i> <span id="modal-seats-value" class="font-semibold"></span> <span data-i18n="car-seats-label-spaced"> Seats</span></div>
                    <div class="flex items-center ltr:justify-start"><i data-lucide="snowflake" class="w-4 h-4 ltr:mr-2 text-accent-blue"></i> <span data-i18n="modal-ac-label-short">A/C</span></div>
                    <div class="flex items-center ltr:justify-start"><i data-lucide="paint-bucket" class="w-4 h-4 ltr:mr-2 text-accent-blue"></i> <span id="modal-color" class="font-semibold"></span></div>
                </div>
                <p id="modal-car-desc" class="text-gray-600 border-t border-gray-100 pt-4"></p>
            </div>
            <div class="flex justify-between items-center mt-6 pt-4 border-t">
                <span class="text-2xl font-extrabold text-primary-dark"><span id="modal-car-price"></span> <span id="modal-car-currency">DH</span> <span class="text-base font-normal text-gray-500" data-i18n="car-day">/ day</span></span>
                <button id="modal-book-button" class="accent-blue text-white font-semibold py-2 px-6 rounded-lg hover:accent-blue-dark transition shadow-md" data-i18n="btn-book-now">Book Now</button>
            </div>
            
            <div id="contact-options" class="space-y-4 mt-6 border-t pt-4 hidden">
                <a id="whatsapp-link" href="#" target="_blank" class="w-full flex items-center justify-center bg-green-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-green-700 transition shadow-md">
                    <i data-lucide="message-circle" class="w-5 h-5 ltr:mr-3"></i> <span data-i18n="btn-whatsapp">WhatsApp</span>
                </a>
                <a id="email-link" href="#" class="w-full flex items-center justify-center bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-blue-700 transition shadow-md">
                    <i data-lucide="mail" class="w-5 h-5 ltr:mr-3"></i> <span data-i18n="btn-email">Email</span>
                </a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDo3yc_pj5vavuWDzOfm5QX1KURnqcF0vs",
          authDomain: "black-iris-fleet-9c64e.firebaseapp.com",
          projectId: "black-iris-fleet-9c64e",
          storageBucket: "black-iris-fleet-9c64e.firebasestorage.app",
          messagingSenderId: "875590751512",
          appId: "1:875590751512:web:7377b8c8fe507053f7ba6d",
          measurementId: "G-4Y7L69L9BS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global variables
        let currentLang = 'en';
        let currentCurrency = 'DH';
        let exchangeRates = { EUR: 0.092, USD: 0.10 };
        let rentalLocation = '', rentalPickupDate = '', rentalReturnDate = '';
        let allCars = [];
        let priceRange, priceValue, filterSidebar, filterBackdrop, mobileMenu, carCountElement, resultsContainer;

        // 1. Translations
        function getTranslation(key) {
            if (typeof translations === 'undefined' || !translations[currentLang]) return key;
            const translation = translations[currentLang][key];
            return (typeof translation === 'function') ? translation : (translation || key);
        }

        // 2. Pricing
        function calculatePrice(basePrice) {
            if (currentCurrency === 'EUR') return { price: (basePrice * exchangeRates.EUR).toFixed(0), symbol: '€' };
            if (currentCurrency === 'USD') return { price: (basePrice * exchangeRates.USD).toFixed(0), symbol: '$' };
            return { price: basePrice, symbol: '' };
        }
        
        function updatePriceDisplay() {
            if (!priceRange || !priceValue) return;
            const currentSliderValue = parseInt(priceRange.value);
            const symbol = currentCurrency === 'DH' ? ' DH' : (currentCurrency === 'EUR' ? ' €' : ' $');
            priceValue.textContent = `${currentSliderValue}${symbol}`;
        }

        // 3. Selectors Update
        function updateAllSelectors(selector, value) {
            document.querySelectorAll(selector).forEach(sel => sel.value = value);
        }

        // 4. Set Language
        function setLanguage(lang) {
            currentLang = lang;
            updateAllSelectors('#language-selector, #language-selector-mobile', lang);
            const dictionary = translations[lang];
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (dictionary[key] && typeof dictionary[key] === 'string') element.textContent = dictionary[key];
            });
            document.body.setAttribute('dir', (lang === 'ar') ? 'rtl' : 'ltr');
            renderAllCars();
            lucide.createIcons();
        }

        // 5. Set Currency
        function setCurrency(currency) {
            currentCurrency = currency;
            updateAllSelectors('#currency-selector, #currency-selector-mobile', currency);
            let newMax = 2000;
            if (currency === 'EUR' || currency === 'USD') newMax = 200; 
            priceRange.max = newMax;
            priceRange.value = newMax; 
            updatePriceDisplay();
            renderAllCars();
        }

        // 6. Fetch Currency Rates
        async function fetchRates() {
            try {
                const response = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/mad.json');
                const data = await response.json();
                if (data && data.mad) {
                    exchangeRates.EUR = data.mad.eur;
                    exchangeRates.USD = data.mad.usd;
                }
            } catch (error) { console.log('Using static rates'); }
            loadCars(); // Start loading cars after rates check
        }

        // 7. Load Cars from Firestore
        async function loadCars() {
            if (!resultsContainer) return;
            resultsContainer.innerHTML = '<div class="col-span-full text-center py-20"><div class="loader mx-auto mb-4"></div></div>';
            
            try {
                // Fetch from 'cars' collection
                const q = query(collection(db, "cars")); 
                const querySnapshot = await getDocs(q);
                
                allCars = [];
                querySnapshot.forEach((doc) => {
                    const d = doc.data();
                    // MAPPING ADMIN DATA TO FRONTEND DATA
                    allCars.push({ 
                        id: doc.id,
                        name: d.name || 'Unknown Car',
                        price: Number(d.price) || 0,
                        // Admin saves as 'imageUrl', frontend uses 'img'
                        img: d.imageUrl || 'https://placehold.co/600x400?text=No+Image',
                        // Admin saves as 'category', frontend filters might use 'type'
                        type: d.category || 'Sedan', 
                        // Admin saves as 'fuelType', frontend uses 'fuel'
                        fuel: d.fuelType || 'Diesel',
                        // Admin saves as 'transmission'
                        transmission: d.transmission || 'Manual',
                        desc: d.description || '',
                        color: d.color || 'Standard',
                        seats: d.seats || 5
                    });
                });
                
                renderAllCars();

            } catch (error) {
                console.error("Error:", error);
                resultsContainer.innerHTML = `<div class="col-span-full text-center text-red-500 py-10">Error loading cars. Check console.</div>`;
            }
        }
        
        // 8. Render Function
        function renderAllCars() {
            resultsContainer.innerHTML = '';
            
            // Re-add the count header
            const header = document.createElement('div');
            header.className = 'col-span-full flex justify-between items-center bg-white p-3 rounded-lg shadow-sm border border-gray-100 mb-4';
            header.innerHTML = '<p class="text-sm text-gray-600" id="car-count">...</p>';
            resultsContainer.appendChild(header);
            carCountElement = header.querySelector('#car-count');

            const sliderValue = parseInt(priceRange.value); 
            const selectedTrans = Array.from(document.querySelectorAll('#transmission-filters input:checked')).map(c => c.value);
            const selectedFuels = Array.from(document.querySelectorAll('#fuel-filters input:checked')).map(c => c.value);

            const filteredCars = allCars.filter(car => {
                // Price Filter
                let comparePrice = car.price; 
                if (currentCurrency !== 'DH') comparePrice = Number(calculatePrice(car.price).price);
                if (comparePrice > sliderValue) return false;

                // Transmission Filter
                if (selectedTrans.length > 0 && !selectedTrans.includes(car.transmission)) return false;

                // Fuel Filter
                if (selectedFuels.length > 0 && !selectedFuels.includes(car.fuel)) return false;

                return true;
            });

            const countText = getTranslation('sort-count-text');
            carCountElement.textContent = `${filteredCars.length} ${countText}`;

            if (filteredCars.length === 0) {
                const msg = document.createElement('div');
                msg.className = "col-span-full text-center py-10 text-gray-500";
                msg.textContent = "No cars match filters.";
                resultsContainer.appendChild(msg);
                return;
            }

            filteredCars.forEach(car => {
                const { price, symbol } = calculatePrice(car.price);
                const carPriceString = `${symbol}${price}${currentCurrency === 'DH' ? ' DH' : ''}`;
                
                // Card HTML
                const carCard = document.createElement('div');
                carCard.className = "car-card bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200 cursor-pointer flex flex-col transition-all duration-300 hover:shadow-2xl hover:-translate-y-1 group";
                carCard.innerHTML = `
                    <div class="relative h-56 overflow-hidden">
                        <img src="${car.img}" alt="${car.name}" class="w-full h-full object-cover transform group-hover:scale-105 transition duration-500">
                        <div class="absolute top-3 left-3 bg-primary-dark text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide shadow-md">
                            ${car.type}
                        </div>
                    </div>
                    <div class="p-6 flex flex-col justify-between flex-grow">
                        <div>
                            <div class="flex justify-between items-start mb-2"><h3 class="text-xl font-bold text-gray-900 leading-tight">${car.name}</h3></div>
                            <div class="grid grid-cols-2 gap-y-2 gap-x-4 text-sm text-gray-600 mb-4 mt-3">
                                <div class="flex items-center"><i data-lucide="${car.transmission.toLowerCase() === 'automatic' ? 'zap' : 'gauge'}" class="w-4 h-4 text-accent-blue mr-2"></i> <span>${getTranslation(car.transmission.toLowerCase())}</span></div>
                                <div class="flex items-center"><i data-lucide="fuel" class="w-4 h-4 text-accent-blue mr-2"></i> <span>${car.fuel}</span></div>
                                <div class="flex items-center"><i data-lucide="users" class="w-4 h-4 text-accent-blue mr-2"></i> <span>${car.seats} Seats</span></div>
                                <div class="flex items-center"><i data-lucide="snowflake" class="w-4 h-4 text-accent-blue mr-2"></i> <span>A/C</span></div>
                            </div>
                        </div>
                        <div class="flex justify-between items-center border-t border-gray-100 pt-4 mt-auto">
                            <div class="flex flex-col"><span class="text-xs text-gray-400 font-medium uppercase">Daily Rate</span><span class="text-2xl font-extrabold text-primary-dark">${carPriceString}</span></div>
                            <button class="accent-blue text-white font-semibold py-2 px-6 rounded-lg hover:accent-blue-dark transition duration-300 shadow-md text-sm book-btn"><span data-i18n="btn-book-now">Book Now</span></button>
                        </div>
                    </div>
                `;
                // Click event for modal
                carCard.addEventListener('click', () => window.openModal(car.name, carPriceString, car.img, car.transmission, car.seats, car.color, car.desc));
                resultsContainer.appendChild(carCard);
            });
            lucide.createIcons();
        }

        // 9. Modal Function
        window.openModal = function(carName, carPriceWithSymbol, carImg, carTrans, carSeats, carColor, carDesc) {
            const dict = translations[currentLang];
            document.getElementById('modal-car-name').textContent = carName;
            document.getElementById('modal-car-image').src = carImg;
            document.getElementById('modal-transmission').textContent = carTrans;
            document.getElementById('modal-seats-value').textContent = carSeats;
            document.getElementById('modal-color').textContent = carColor;
            document.getElementById('modal-car-desc').textContent = carDesc;
            document.getElementById('modal-car-price').textContent = carPriceWithSymbol.replace(/ DH| €| \$/g, '');
            document.getElementById('modal-car-currency').textContent = currentCurrency === 'DH' ? 'DH' : (currentCurrency === 'EUR' ? '€' : '$');
            
            // Set WhatsApp/Email links
            let whatsappMessage, emailSubject, emailBody;
            if (rentalPickupDate) {
                 whatsappMessage = dict['book-whatsapp-msg-full'](carName, carPriceWithSymbol, rentalLocation, rentalPickupDate, rentalReturnDate);
            } else {
                 whatsappMessage = dict['book-whatsapp-msg-concise'](carName, carPriceWithSymbol);
            }
            document.getElementById('whatsapp-link').href = `https://wa.me/212602020402?text=${encodeURIComponent(whatsappMessage)}`;

            document.getElementById('contact-options').classList.add('hidden');
            document.getElementById('modal-book-button').classList.remove('hidden'); 
            
            document.getElementById('modal-book-button').onclick = () => {
                document.getElementById('contact-options').classList.remove('hidden');
                document.getElementById('modal-book-button').classList.add('hidden');
            };

            const modal = document.getElementById('car-detail-modal');
            modal.classList.remove('hidden');
            setTimeout(() => { document.getElementById('modal-detail-content').classList.remove('scale-95', 'opacity-0'); }, 10);
        }

        // 10. Initialization
        document.addEventListener('DOMContentLoaded', () => {
            priceRange = document.getElementById('price-range');
            priceValue = document.getElementById('price-value');
            filterSidebar = document.getElementById('filter-sidebar');
            resultsContainer = document.getElementById('results-container');
            
            // Filters
            document.querySelectorAll('#filter-form input').forEach(inp => {
                inp.addEventListener('change', renderAllCars);
            });
            priceRange.addEventListener('input', updatePriceDisplay);
            priceRange.addEventListener('change', renderAllCars);
            document.getElementById('apply-filters-btn').addEventListener('click', () => { renderAllCars(); filterSidebar.classList.remove('open'); });
            
            // Close Modal
            document.getElementById('close-detail-modal-btn').addEventListener('click', () => {
                 document.getElementById('car-detail-modal').classList.add('hidden');
            });
            
            // Sidebar Toggles
            document.getElementById('filter-menu-button').addEventListener('click', () => filterSidebar.classList.add('open'));
            document.getElementById('filter-close-button').addEventListener('click', () => filterSidebar.classList.remove('open'));

            // Load saved preferences
            const savedLang = localStorage.getItem('languagePreference') || 'en';
            rentalLocation = localStorage.getItem('rentalLocation');
            rentalPickupDate = localStorage.getItem('rentalPickupDate');
            rentalReturnDate = localStorage.getItem('rentalReturnDate');
