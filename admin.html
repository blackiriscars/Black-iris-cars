<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Black Iris Fleet</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase Compat Libraries (Works better in simple HTML files) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #2563eb; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Ensure overlay doesn't block clicks when hidden */
        .overlay-hidden { display: none !important; pointer-events: none !important; }
    </style>
</head>
<body class="bg-gray-100 h-screen overflow-hidden text-gray-800">

    <!-- LOGIN OVERLAY -->
    <div id="login-overlay" class="fixed inset-0 bg-gray-900 z-[100] flex items-center justify-center transition-opacity duration-300">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md mx-4 relative z-[101]">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gray-200 rounded-full mx-auto mb-4 flex items-center justify-center border border-gray-300">
                    <i data-lucide="lock" class="w-8 h-8 text-gray-500"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Admin Login</h2>
            </div>
            <form id="login-form" class="space-y-4">
                <input type="email" id="login-email" placeholder="Email" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                <input type="password" id="login-password" placeholder="Password" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition shadow-lg">Sign In</button>
                <p id="login-error" class="text-red-500 text-sm text-center hidden mt-2"></p>
            </form>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="flex h-screen opacity-0 transition-opacity duration-300">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-white hidden md:flex flex-col shadow-xl z-20 relative">
            <div class="p-6 text-2xl font-bold text-center border-b border-gray-700 tracking-wider">Black Iris</div>
            <nav class="flex-1 p-4 space-y-2">
                <button id="nav-all-cars" onclick="switchTab('list')" class="w-full flex items-center px-4 py-3 bg-blue-600 text-white rounded-lg shadow-lg hover:bg-blue-700 transition cursor-pointer">
                    <i data-lucide="car" class="w-5 h-5 mr-3"></i> Fleet List
                </button>
                <button id="nav-add-car" onclick="resetForm()" class="w-full flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg transition cursor-pointer">
                    <i data-lucide="plus-circle" class="w-5 h-5 mr-3"></i> Add/Edit Car
                </button>
            </nav>
            <div class="p-4 border-t border-gray-700 bg-gray-800">
                <button id="logout-btn" class="w-full flex items-center justify-center px-4 py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold transition shadow cursor-pointer">
                    <i data-lucide="log-out" class="w-5 h-5 mr-2"></i> LOGOUT
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto relative bg-gray-50 z-10">
            <!-- Mobile Header -->
            <header class="md:hidden bg-gray-900 text-white p-4 flex justify-between items-center sticky top-0 z-30 shadow-md">
                <span class="font-bold text-lg">Admin Panel</span>
                <button onclick="handleLogout()" class="text-red-400 p-2"><i data-lucide="log-out" class="w-6 h-6"></i></button>
            </header>

            <!-- LIST VIEW -->
            <div id="view-all-cars" class="p-4 md:p-8 max-w-7xl mx-auto">
                <header class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Current Fleet</h2>
                    <button onclick="resetForm()" class="hidden md:block bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-bold hover:bg-blue-700 shadow transition transform hover:scale-105">+ Add Car</button>
                </header>
                
                <div id="loading-cars" class="text-center py-20 text-gray-500">
                    <div class="loader mx-auto mb-4"></div> Loading database...
                </div>
                
                <div id="cars-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pb-20"></div>
            </div>

            <!-- ADD/EDIT FORM -->
            <div id="view-add-car" class="p-4 md:p-8 max-w-5xl mx-auto hidden">
                <header class="flex justify-between items-center mb-6">
                    <h2 id="form-title" class="text-2xl font-bold text-gray-800">Add New Vehicle</h2>
                    <button onclick="switchTab('list')" class="text-gray-500 hover:text-gray-700 font-medium px-4 py-2 hover:bg-gray-100 rounded-lg">Cancel</button>
                </header>

                <div class="bg-white rounded-xl shadow-lg p-6 md:p-8 border border-gray-100 mb-20">
                    <form id="add-car-form">
                        <input type="hidden" id="edit-doc-id"> <!-- Hidden ID for editing -->
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            
                            <!-- Left Column -->
                            <div class="space-y-6">
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">Car Name</label>
                                    <input type="text" id="car-name" placeholder="e.g. VW Touareg" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                </div>

                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-bold text-gray-700 mb-2">Price (DH/day)</label>
                                        <input type="number" id="car-price" placeholder="1400" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-gray-700 mb-2">Seats</label>
                                        <input type="number" id="car-seats" placeholder="5" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">Car Model / Category</label>
                                    <select id="car-type" class="w-full p-3 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                                        <option value="suv">SUV</option>
                                        <option value="sedan">Sedan</option>
                                        <option value="hatchback">Hatchback</option>
                                        <option value="luxury-suv">Luxury SUV</option>
                                        <option value="luxury-sedan">Luxury Sedan</option>
                                        <option value="van">Van / 7+ Seats</option>
                                    </select>
                                </div>

                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-bold text-gray-700 mb-2">Status</label>
                                        <select id="car-status" class="w-full p-3 border border-gray-300 rounded-lg bg-white font-medium text-gray-700">
                                            <option value="Available">✅ Available</option>
                                            <option value="Booked">🔴 Booked</option>
                                            <option value="Maintenance">⚠️ Maintenance</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-gray-700 mb-2">Fuel Type</label>
                                        <select id="car-fuel" class="w-full p-3 border border-gray-300 rounded-lg bg-white">
                                            <option value="Diesel">Diesel</option>
                                            <option value="Petrol">Petrol</option>
                                            <option value="Hybrid">Hybrid</option>
                                            <option value="Electric">Electric</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 gap-4 bg-gray-50 p-3 rounded-lg border border-gray-200">
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 mb-1">Transmission</label>
                                        <select id="car-transmission" class="w-full p-2 border rounded text-sm bg-white"><option>Automatic</option><option>Manual</option></select>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 mb-1">Color</label>
                                        <input type="text" id="car-color" placeholder="Black" class="w-full p-2 border rounded text-sm">
                                    </div>
                                </div>
                            </div>

                            <!-- Right Column -->
                            <div class="space-y-6">
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">Car Image Link</label>
                                    <div class="p-3 bg-blue-50 border border-blue-200 rounded text-xs text-blue-800 mb-2">
                                        Upload to <a href="https://postimages.org/" target="_blank" class="underline font-bold">PostImages.org</a> & paste "Direct Link".
                                    </div>
                                    <input type="url" id="car-image-url" placeholder="https://i.postimg.cc/..." required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                </div>

                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">Description</label>
                                    <textarea id="car-desc" rows="5" placeholder="Full-size luxury SUV, offering ultimate comfort..." required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                                </div>

                                <div class="pt-4">
                                    <button type="submit" id="save-btn" class="w-full bg-green-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-green-700 transition shadow-lg flex items-center justify-center text-lg transform active:scale-95">
                                        <span id="save-text">Publish Car</span>
                                        <div id="save-loader" class="loader ml-3 hidden border-white border-t-transparent"></div>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- INITIALIZATION SCRIPT -->
    <script>
        // Initialize Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyDo3yc_pj5vavuWDzOfm5QX1KURnqcF0vs",
          authDomain: "black-iris-fleet-9c64e.firebaseapp.com",
          projectId: "black-iris-fleet-9c64e",
          storageBucket: "black-iris-fleet-9c64e.firebasestorage.app",
          messagingSenderId: "875590751512",
          appId: "1:875590751512:web:7377b8c8fe507053f7ba6d",
          measurementId: "G-4Y7L69L9BS"
        };

        // Initialize compat apps
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        // Initialize Icons
        lucide.createIcons();

        let allCarsData = [];

        // --- GLOBAL FUNCTIONS (Must be defined for onclick HTML attributes) ---
        
        function switchTab(tab) {
            if (tab === 'list') {
                document.getElementById('view-all-cars').classList.remove('hidden');
                document.getElementById('view-add-car').classList.add('hidden');
                
                // Update styling of nav buttons
                document.getElementById('nav-all-cars').classList.add('bg-blue-600', 'text-white', 'shadow-lg');
                document.getElementById('nav-all-cars').classList.remove('text-gray-300', 'hover:bg-gray-800');
                
                document.getElementById('nav-add-car').classList.remove('bg-blue-600', 'text-white', 'shadow-lg');
                document.getElementById('nav-add-car').classList.add('text-gray-300', 'hover:bg-gray-800');
                
                loadCars();
            } else {
                document.getElementById('view-all-cars').classList.add('hidden');
                document.getElementById('view-add-car').classList.remove('hidden');
                
                // Update styling of nav buttons
                document.getElementById('nav-all-cars').classList.remove('bg-blue-600', 'text-white', 'shadow-lg');
                document.getElementById('nav-all-cars').classList.add('text-gray-300', 'hover:bg-gray-800');
                
                document.getElementById('nav-add-car').classList.add('bg-blue-600', 'text-white', 'shadow-lg');
                document.getElementById('nav-add-car').classList.remove('text-gray-300', 'hover:bg-gray-800');
            }
        }

        function resetForm() {
            document.getElementById('add-car-form').reset();
            document.getElementById('edit-doc-id').value = '';
            document.getElementById('form-title').textContent = 'Add New Vehicle';
            document.getElementById('save-text').textContent = 'Publish Car';
            
            const btn = document.getElementById('save-btn');
            btn.className = "w-full bg-green-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-green-700 transition shadow-lg flex items-center justify-center text-lg transform active:scale-95";
            
            switchTab('add');
        }

        async function handleLogout() {
            try {
                await auth.signOut();
            } catch(e) {
                console.error(e);
            }
        }

        // --- AUTH LOGIC ---
        auth.onAuthStateChanged((user) => {
            const overlay = document.getElementById('login-overlay');
            const dashboard = document.getElementById('dashboard');

            if (user) {
                // HIDE Overlay completely
                overlay.classList.add('opacity-0', 'overlay-hidden'); 
                
                // SHOW Dashboard
                dashboard.classList.remove('opacity-0');
                dashboard.style.display = 'flex'; // Ensure flex layout
                
                loadCars();
            } else {
                // SHOW Overlay
                overlay.classList.remove('opacity-0', 'overlay-hidden');
                
                // HIDE Dashboard
                dashboard.classList.add('opacity-0');
                // Optional: delay display:none to allow fade out
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errEl = document.getElementById('login-error');
            
            errEl.classList.add('hidden');
            
            try {
                await auth.signInWithEmailAndPassword(email, password);
                // Listener handles transition
            } catch (err) {
                errEl.textContent = "Invalid login credentials: " + err.message;
                errEl.classList.remove('hidden');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', handleLogout);

        // --- DATA LOGIC ---
        async function loadCars() {
            const container = document.getElementById('cars-container');
            const loader = document.getElementById('loading-cars');
            
            loader.classList.remove('hidden');
            
            try {
                const snapshot = await db.collection('cars').orderBy('createdAt', 'desc').get();
                
                loader.classList.add('hidden');
                container.innerHTML = '';
                allCarsData = [];

                if (snapshot.empty) {
                    container.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10 bg-white rounded border border-dashed border-gray-300">No cars found. Click "Add Car" to start.</div>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const car = doc.data();
                    car.id = doc.id;
                    allCarsData.push(car);

                    const div = document.createElement('div');
                    div.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col hover:shadow-md transition-shadow duration-200";
                    
                    const statusColor = car.status === 'Available' ? 'bg-green-100 text-green-700' : 
                                      car.status === 'Booked' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700';
                    
                    div.innerHTML = `
                        <div class="relative h-48 mb-4 overflow-hidden rounded-lg bg-gray-100 group">
                            <img src="${car.img}" onerror="this.src='https://placehold.co/400x300?text=No+Image'" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                            <div class="absolute top-2 right-2">
                                <span class="text-xs font-bold ${statusColor} px-2 py-1 rounded-full shadow-sm uppercase tracking-wide">${car.status}</span>
                            </div>
                        </div>
                        
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-gray-900 text-lg leading-tight">${car.name}</h3>
                            <span class="font-bold text-blue-600">${car.price} <span class="text-xs text-gray-500 font-normal">DH/day</span></span>
                        </div>
                        
                        <div class="text-xs text-gray-500 mb-4 flex gap-2">
                            <span class="bg-gray-100 px-2 py-1 rounded">${car.type}</span>
                            <span class="bg-gray-100 px-2 py-1 rounded">${car.fuel}</span>
                            <span class="bg-gray-100 px-2 py-1 rounded">${car.transmission || 'Auto'}</span>
                        </div>
                        
                        <div class="mt-auto grid grid-cols-2 gap-2">
                            <button onclick="editCar('${car.id}')" class="py-2 bg-white text-gray-700 rounded-lg text-sm font-semibold hover:bg-gray-50 border border-gray-200 hover:border-gray-300 transition flex items-center justify-center gap-1">
                                <i data-lucide="edit-2" class="w-3 h-3"></i> Edit
                            </button>
                            <button onclick="deleteCar('${car.id}')" class="py-2 bg-white text-red-600 rounded-lg text-sm font-semibold hover:bg-red-50 border border-gray-200 hover:border-red-200 transition flex items-center justify-center gap-1">
                                <i data-lucide="trash" class="w-3 h-3"></i> Delete
                            </button>
                        </div>
                    `;
                    container.appendChild(div);
                });
                lucide.createIcons();

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="col-span-full text-red-500 bg-red-50 p-4 rounded text-center">Error loading data: ${err.message}</div>`;
            }
        }

        // --- ACTION FUNCTIONS ---
        window.editCar = function(id) {
            const car = allCarsData.find(c => c.id === id);
            if(!car) return;

            document.getElementById('edit-doc-id').value = id;
            document.getElementById('car-name').value = car.name;
            document.getElementById('car-price').value = car.price;
            document.getElementById('car-color').value = car.color || '';
            document.getElementById('car-transmission').value = car.transmission || 'Automatic';
            document.getElementById('car-seats').value = car.seats || 5;
            document.getElementById('car-type').value = car.type || 'suv';
            document.getElementById('car-status').value = car.status || 'Available';
            document.getElementById('car-fuel').value = car.fuel || 'Diesel';
            document.getElementById('car-image-url').value = car.img;
            document.getElementById('car-desc').value = car.desc;

            document.getElementById('form-title').textContent = 'Edit Vehicle';
            document.getElementById('save-text').textContent = 'Update Car';
            
            const btn = document.getElementById('save-btn');
            btn.className = "w-full bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition shadow-lg flex items-center justify-center text-lg transform active:scale-95";

            switchTab('add');
        };

        window.deleteCar = async function(id) {
            if(confirm("Are you sure you want to delete this car? This action cannot be undone.")) {
                try {
                    await db.collection('cars').doc(id).delete();
                    loadCars();
                } catch(e) {
                    alert("Delete failed: " + e.message);
                }
            }
        };

        // SAVE LOGIC
        document.getElementById('add-car-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            const loader = document.getElementById('save-loader');
            const editId = document.getElementById('edit-doc-id').value;

            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            loader.classList.remove('hidden');
            
            const carData = {
                name: document.getElementById('car-name').value,
                price: Number(document.getElementById('car-price').value),
                color: document.getElementById('car-color').value,
                transmission: document.getElementById('car-transmission').value,
                seats: Number(document.getElementById('car-seats').value),
                type: document.getElementById('car-type').value,
                status: document.getElementById('car-status').value,
                fuel: document.getElementById('car-fuel').value,
                img: document.getElementById('car-image-url').value,
                desc: document.getElementById('car-desc').value,
                createdAt: firebase.firestore.FieldValue.serverTimestamp() // Better timestamp
            };

            try {
                if (editId) {
                    await db.collection('cars').doc(editId).update(carData);
                    alert("Car Updated Successfully!");
                } else {
                    await db.collection('cars').add(carData);
                    alert("Car Published Successfully!");
                }
                resetForm();
                loadCars();
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                loader.classList.add('hidden');
            }
        });

    </script>
</body>
</html>
