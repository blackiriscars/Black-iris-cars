<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .nav-item.active { background-color: rgb(67 56 202); border-left: 4px solid rgb(199 210 254); }
        #sidebar { transition: transform 0.3s ease-in-out; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-[100dvh] w-full overflow-hidden flex flex-col md:flex-row">

    <div id="login-screen" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="bg-indigo-600 p-8 text-center">
                <i class="fas fa-shield-alt text-5xl text-indigo-200 mb-4"></i>
                <h2 class="text-2xl font-bold text-white tracking-wide">Black Iris Fleet</h2>
                <p class="text-indigo-200 text-sm mt-1">Admin Control Panel</p>
            </div>
            <form id="loginForm" class="p-8 space-y-6">
                <div id="loginError" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg flex items-center gap-2">
                    <i class="fas fa-exclamation-circle"></i> <span id="errorMsg">Invalid credentials</span>
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-bold text-gray-700">Email Address</label>
                    <input type="email" id="email" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="admin@blackiris.com" required>
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-bold text-gray-700">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all active:scale-[0.98]">Sign In</button>
            </form>
        </div>
    </div>

    <header class="md:hidden h-16 bg-indigo-900 text-white flex items-center justify-between px-4 fixed top-0 w-full z-40 shadow-md">
        <div class="flex items-center gap-2"><i class="fas fa-shield-alt text-indigo-300"></i><span class="font-bold text-lg">AdminPanel</span></div>
        <button onclick="toggleMenu()" class="p-2 rounded-lg cursor-pointer"><i class="fas fa-bars text-xl"></i></button>
    </header>

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-indigo-900 text-white shadow-2xl z-50 flex flex-col transform -translate-x-full md:translate-x-0 md:relative md:w-64">
        <div class="h-16 flex items-center justify-between px-6 bg-indigo-950 border-b border-indigo-800 shrink-0">
            <span class="text-xl font-bold">Menu</span>
            <button onclick="toggleMenu()" class="md:hidden p-2 text-indigo-300 hover:text-white"><i class="fas fa-times text-xl"></i></button>
        </div>
        <nav class="flex-1 overflow-y-auto py-4">
            <ul class="space-y-2">
                <li><button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-item active w-full flex items-center gap-3 px-6 py-4 hover:bg-indigo-800 transition-colors text-left"><i class="fas fa-chart-line w-5 text-center"></i><span class="font-medium">Dashboard</span></button></li>
                <li class="px-6 pt-4 pb-1 text-xs font-bold text-indigo-400 uppercase">Inventory</li>
                <li><button onclick="switchTab('fleet')" id="nav-fleet" class="nav-item w-full flex items-center gap-3 px-6 py-4 hover:bg-indigo-800 transition-colors text-left"><i class="fas fa-car w-5 text-center"></i><span class="font-medium">Fleet Inventory</span></button></li>
                <li><button onclick="switchTab('add-car', true)" id="nav-add-car" class="nav-item w-full flex items-center gap-3 px-6 py-4 hover:bg-indigo-800 transition-colors text-left"><i class="fas fa-plus-circle w-5 text-center"></i><span class="font-medium">Add New Car</span></button></li>
            </ul>
        </nav>
        <div class="p-4 border-t border-indigo-800 bg-indigo-950 shrink-0">
            <button onclick="handleLogout()" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-medium shadow-md flex items-center justify-center gap-2"><i class="fas fa-sign-out-alt"></i> Exit Panel</button>
        </div>
    </aside>

    <div id="mobileOverlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/50 z-45 hidden md:hidden backdrop-blur-sm"></div>
    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full bg-gray-50 z-0">
        <header class="hidden md:flex h-16 bg-white shadow-sm items-center justify-between px-8 border-b border-gray-200 shrink-0 z-10">
            <h2 id="desktopTitle" class="text-xl font-bold text-gray-800">Dashboard Overview</h2>
        </header>

        <div class="flex-1 overflow-y-auto overflow-x-hidden p-4 pt-20 md:p-8 md:pt-8 w-full">
            <div id="view-dashboard" class="page-view animate-fade-in block space-y-6">
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200"><div><p class="text-xs font-bold text-gray-400 uppercase">Total</p><h3 class="text-3xl font-bold text-gray-800 mt-1" id="stat-total">0</h3></div></div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200"><div><p class="text-xs font-bold text-gray-400 uppercase">Available</p><h3 class="text-3xl font-bold text-green-600 mt-1" id="stat-available">0</h3></div></div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200"><div><p class="text-xs font-bold text-gray-400 uppercase">Rented</p><h3 class="text-3xl font-bold text-orange-600 mt-1" id="stat-rented">0</h3></div></div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200"><div><p class="text-xs font-bold text-gray-400 uppercase">Maint.</p><h3 class="text-3xl font-bold text-red-600 mt-1" id="stat-maintenance">0</h3></div></div>
                </div>
            </div>

            <div id="view-fleet" class="page-view hidden space-y-4">
                <div class="flex justify-between items-center"><h2 class="text-2xl font-bold">Fleet</h2><button onclick="switchTab('add-car', true)" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold">Add New</button></div>
                <div id="carsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 pb-20"></div>
            </div>

            <div id="view-add-car" class="page-view hidden space-y-4">
                <h2 id="formPageTitle" class="text-2xl font-bold text-gray-800">Add New Vehicle</h2>
                <div class="bg-white rounded-xl shadow-md border border-gray-200 p-6 md:p-8">
                    <form id="addCarForm" class="space-y-6">
                        <input type="hidden" id="editCarId">
                        
                        <div><label class="block text-sm font-bold text-gray-700 mb-2">Vehicle Name</label><input type="text" id="carName" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-indigo-500" placeholder="e.g. Range Rover Sport"></div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">Category</label>
                                <select id="carType" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg">
                                    <option value="sedan">Sedan</option><option value="suv">SUV</option><option value="luxury-suv">Luxury SUV</option><option value="hatchback">Hatchback</option><option value="luxury">Luxury</option><option value="sports">Sports</option><option value="van">Van</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">Fuel Type</label>
                                <select id="carFuel" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg">
                                    <option value="Diesel">Diesel</option><option value="Petrol">Petrol</option><option value="Hybrid">Hybrid</option><option value="Electric">Electric</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-sm font-bold text-gray-700 mb-2">Price/Day (DH)</label><input type="number" id="carPrice" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg" placeholder="0"></div>
                            <div><label class="block text-sm font-bold text-gray-700 mb-2">Seats</label><input type="number" id="carSeats" value="5" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg"></div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-sm font-bold text-gray-700 mb-2">Transmission</label><select id="carTransmission" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg"><option value="automatic">Automatic</option><option value="manual">Manual</option></select></div>
                            <div><label class="block text-sm font-bold text-gray-700 mb-2">Color</label><input type="text" id="carColor" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg" placeholder="e.g. Black"></div>
                        </div>

                        <div><label class="block text-sm font-bold text-gray-700 mb-2">Status</label><select id="carStatus" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg"><option value="Available">Available</option><option value="Rented">Rented</option><option value="Maintenance">Maintenance</option></select></div>
                        <div><label class="block text-sm font-bold text-gray-700 mb-2">Image URL</label><input type="url" id="carImg" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg" placeholder="https://..."></div>
                        <div><label class="block text-sm font-bold text-gray-700 mb-2">Description</label><textarea id="carDesc" rows="3" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg"></textarea></div>
                        
                        <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-indigo-700 transition-all">Save Vehicle</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDo3yc_pj5vavuWDzOfm5QX1KURnqcF0vs", authDomain: "black-iris-fleet-9c64e.firebaseapp.com", projectId: "black-iris-fleet-9c64e", storageBucket: "black-iris-fleet-9c64e.firebasestorage.app", messagingSenderId: "875590751512", appId: "1:875590751512:web:7377b8c8fe507053f7ba6d", measurementId: "G-4Y7L69L9BS" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const collectionPath = 'cars';

        let currentUser = null, carsData = [];

        onAuthStateChanged(auth, u => {
            document.getElementById('login-screen').classList.toggle('hidden', !!u);
            if (u) { currentUser = u; loadCars(); }
        });

        document.getElementById('loginForm').addEventListener('submit', async e => {
            e.preventDefault();
            try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); }
            catch (err) { document.getElementById('errorMsg').innerText = "Login Failed"; document.getElementById('loginError').classList.remove('hidden'); }
        });

        window.handleLogout = async () => { if(confirm("Exit?")) { await signOut(auth); location.reload(); } };

        function loadCars() {
            onSnapshot(collection(db, collectionPath), snap => {
                carsData = []; snap.forEach(d => carsData.push({id: d.id, ...d.data()}));
                updateStats(); renderCars(carsData);
            });
        }

        function updateStats() {
            document.getElementById('stat-total').innerText = carsData.length;
            document.getElementById('stat-available').innerText = carsData.filter(c => c.status === 'Available').length;
            document.getElementById('stat-rented').innerText = carsData.filter(c => c.status === 'Rented').length;
            document.getElementById('stat-maintenance').innerText = carsData.filter(c => c.status === 'Maintenance').length;
        }

        function renderCars(list) {
            const grid = document.getElementById('carsGrid'); grid.innerHTML = '';
            list.forEach(car => {
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                        <div class="relative h-48 bg-gray-200"><img src="${car.img||''}" class="w-full h-full object-cover"><span class="absolute top-2 right-2 px-2 py-1 rounded-md text-xs font-bold uppercase bg-white/90 text-gray-800">${car.status}</span></div>
                        <div class="p-4 flex-1 flex flex-col"><h3 class="font-bold text-lg text-gray-900">${car.name}</h3>
                        <div class="flex flex-wrap gap-2 my-2 text-xs text-gray-600">
                            <span class="bg-gray-100 px-2 py-1 rounded border">${car.type||'Car'}</span>
                            <span class="bg-gray-100 px-2 py-1 rounded border">${car.fuel||'Fuel?'}</span>
                            <span class="bg-gray-100 px-2 py-1 rounded border">${car.color||'Color?'}</span>
                        </div>
                        <div class="mt-auto flex justify-between items-center"><span class="font-bold text-indigo-600 text-lg">${car.price} DH</span>
                        <div class="flex gap-2"><button onclick="editCar('${car.id}')" class="text-blue-600"><i class="fas fa-edit"></i></button><button onclick="deleteCar('${car.id}')" class="text-red-500"><i class="fas fa-trash"></i></button></div></div></div>
                    </div>`;
            });
        }

        window.editCar = (id) => {
            const car = carsData.find(c => c.id === id);
            window.switchTab('add-car', false);
            document.getElementById('editCarId').value = car.id;
            document.getElementById('carName').value = car.name;
            document.getElementById('carType').value = car.type || 'sedan';
            document.getElementById('carFuel').value = car.fuel || 'Diesel';
            document.getElementById('carPrice').value = car.price;
            document.getElementById('carSeats').value = car.seats;
            document.getElementById('carTransmission').value = car.transmission || 'automatic';
            document.getElementById('carColor').value = car.color || '';
            document.getElementById('carStatus').value = car.status || 'Available';
            document.getElementById('carImg').value = car.img || '';
            document.getElementById('carDesc').value = car.desc || '';
            document.getElementById('submitBtn').innerText = 'Update Vehicle';
        };

        window.deleteCar = async (id) => { if(confirm('Delete?')) await deleteDoc(doc(db, collectionPath, id)); };

        document.getElementById('addCarForm').addEventListener('submit', async e => {
            e.preventDefault();
            const id = document.getElementById('editCarId').value;
            const data = {
                name: document.getElementById('carName').value,
                type: document.getElementById('carType').value,
                fuel: document.getElementById('carFuel').value,
                price: Number(document.getElementById('carPrice').value),
                seats: Number(document.getElementById('carSeats').value),
                transmission: document.getElementById('carTransmission').value,
                color: document.getElementById('carColor').value,
                status: document.getElementById('carStatus').value,
                img: document.getElementById('carImg').value,
                desc: document.getElementById('carDesc').value,
                updatedAt: serverTimestamp()
            };
            if(id) await updateDoc(doc(db, collectionPath, id), data);
            else { data.createdAt = serverTimestamp(); await addDoc(collection(db, collectionPath), data); }
            document.getElementById('addCarForm').reset();
            window.switchTab('fleet');
        });

        window.switchTab = (t, r) => {
            document.querySelectorAll('.page-view').forEach(e => e.classList.add('hidden'));
            document.getElementById('view-'+t).classList.remove('hidden');
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('mobileOverlay').classList.add('hidden');
            if(t==='add-car' && r) { document.getElementById('addCarForm').reset(); document.getElementById('editCarId').value=''; document.getElementById('submitBtn').innerText='Save Vehicle'; }
        };
    </script>
</body>
</html>
