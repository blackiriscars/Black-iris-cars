<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Iris Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f3f4f6; color: #111; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Mobile Menu Slide */
        .slide-in { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        
        /* Loading Spinner */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #000; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            doc, 
            onSnapshot,
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- ICONS ---
        const Icons = {
            Menu: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
        };

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyDo3yc_pj5vavuWDzOfm5QX1KURnqcF0vs",
            authDomain: "black-iris-fleet-9c64e.firebaseapp.com",
            projectId: "black-iris-fleet-9c64e",
            storageBucket: "black-iris-fleet-9c64e.firebasestorage.app",
            messagingSenderId: "875590751512",
            appId: "1:875590751512:web:7377b8c8fe507053f7ba6d",
            measurementId: "G-4Y7L69L9BS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- DASHBOARD ---
        function Dashboard({ user }) {
            const [view, setView] = React.useState('inventory'); // 'inventory' or 'add'
            const [menuOpen, setMenuOpen] = React.useState(false);
            const [cars, setCars] = React.useState([]);
            
            // Edit State
            const [editingCar, setEditingCar] = React.useState(null);

            // Form State
            const [formData, setFormData] = React.useState({
                make: '', model: '', year: '', price: '', imageUrl: '', status: 'Available'
            });

            // 1. DATA FETCHING
            React.useEffect(() => {
                const unsubscribe = onSnapshot(collection(db, "cars"), (snapshot) => {
                    const carList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setCars(carList);
                });
                return () => unsubscribe();
            }, []);

            // 2. FORM HANDLERS
            const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    if (editingCar) {
                        await updateDoc(doc(db, "cars", editingCar.id), { ...formData, updatedAt: serverTimestamp() });
                        setEditingCar(null);
                        alert("Car updated successfully.");
                    } else {
                        await addDoc(collection(db, "cars"), { ...formData, createdAt: serverTimestamp() });
                        alert("Car added successfully.");
                    }
                    // Reset
                    setFormData({ make: '', model: '', year: '', price: '', imageUrl: '', status: 'Available' });
                    setView('inventory'); // Go back to inventory after adding
                } catch (error) {
                    alert("Error saving: " + error.message);
                }
            };

            const handleEdit = (car) => {
                setEditingCar(car);
                setFormData({ ...car });
                setView('add'); // Reuse the add view for editing
                setMenuOpen(false);
            };

            const handleDelete = async (id) => {
                if (confirm("Are you sure? This will remove the car from the database entirely.")) {
                    try {
                        await deleteDoc(doc(db, "cars", id));
                    } catch(err) {
                        alert("Delete failed: " + err.message);
                    }
                }
            };

            // Menu Helpers
            const closeMenu = () => setMenuOpen(false);
            const openView = (v) => {
                if (v === 'add') {
                    setEditingCar(null);
                    setFormData({ make: '', model: '', year: '', price: '', imageUrl: '', status: 'Available' });
                }
                setView(v);
                closeMenu();
            };

            return (
                <div className="min-h-screen bg-white text-black" onClick={(e) => {
                    // Close menu if clicking outside sidebar
                    if (menuOpen && !e.target.closest('#sidebar') && !e.target.closest('#menu-btn')) {
                        closeMenu();
                    }
                }}>
                    
                    {/* Header */}
                    <header className="bg-white border-b border-gray-200 p-4 flex justify-between items-center sticky top-0 z-20">
                        <div className="flex items-center gap-4">
                            <button id="menu-btn" onClick={() => setMenuOpen(!menuOpen)} className="p-2 hover:bg-gray-100 rounded-full transition-colors">
                                {menuOpen ? <Icons.X /> : <Icons.Menu />}
                            </button>
                            <h1 className="text-xl font-bold tracking-tight">Black Iris Fleet</h1>
                        </div>
                    </header>

                    {/* Sidebar Menu */}
                    {menuOpen && (
                        <div id="sidebar" className="fixed inset-y-0 left-0 w-64 bg-black text-white z-30 shadow-2xl p-6 slide-in flex flex-col">
                            <h2 className="text-xl font-bold mb-8 text-gray-400">Menu</h2>
                            <nav className="space-y-4 flex-1">
                                <button 
                                    onClick={() => openView('inventory')} 
                                    className={`w-full text-left py-3 px-4 rounded-lg flex items-center gap-3 transition-colors ${view === 'inventory' ? 'bg-white text-black font-bold' : 'hover:bg-gray-800'}`}
                                >
                                    <span className="text-lg">Inventory</span>
                                </button>
                                <button 
                                    onClick={() => openView('add')} 
                                    className={`w-full text-left py-3 px-4 rounded-lg flex items-center gap-3 transition-colors ${view === 'add' ? 'bg-white text-black font-bold' : 'hover:bg-gray-800'}`}
                                >
                                    <Icons.Plus />
                                    <span className="text-lg">Add Car</span>
                                </button>
                            </nav>
                            <div className="border-t border-gray-800 pt-6">
                                <p className="text-gray-500 text-sm mb-2">User: {user.email}</p>
                                <button onClick={() => signOut(auth)} className="flex items-center gap-2 text-red-400 hover:text-red-300 font-bold">
                                    <Icons.LogOut /> Sign Out
                                </button>
                            </div>
                        </div>
                    )}
                    
                    {/* Overlay for menu */}
                    {menuOpen && <div className="fixed inset-0 bg-black/50 z-20 backdrop-blur-sm"></div>}

                    {/* MAIN CONTENT AREA */}
                    <main className="max-w-4xl mx-auto p-6 fade-in">
                        
                        {/* VIEW: INVENTORY */}
                        {view === 'inventory' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold">Current Inventory</h2>
                                    <span className="text-gray-500 text-sm">{cars.length} vehicles</span>
                                </div>

                                <div className="grid grid-cols-1 gap-6">
                                    {cars.map(car => (
                                        <div key={car.id} className="bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition-shadow overflow-hidden flex flex-col sm:flex-row">
                                            {/* Image - Forced to show */}
                                            <div className="sm:w-1/3 h-48 sm:h-auto bg-gray-100 relative">
                                                {car.imageUrl ? (
                                                    <img 
                                                        src={car.imageUrl} 
                                                        className="w-full h-full object-cover" 
                                                        alt="Vehicle"
                                                    />
                                                ) : (
                                                    <div className="w-full h-full flex items-center justify-center text-gray-400">No Image</div>
                                                )}
                                                <div className="absolute top-2 left-2">
                                                     <span className="px-2 py-1 bg-black text-white text-xs font-bold uppercase">{car.status}</span>
                                                </div>
                                            </div>

                                            {/* Details */}
                                            <div className="p-5 flex-1 flex flex-col justify-between">
                                                <div>
                                                    <h3 className="text-xl font-bold">{car.year} {car.make} {car.model}</h3>
                                                    <p className="text-2xl font-bold mt-2">${Number(car.price).toLocaleString()}</p>
                                                </div>
                                                
                                                <div className="flex gap-3 mt-4">
                                                    <button onClick={() => handleEdit(car)} className="flex-1 py-2 px-4 bg-black text-white rounded font-medium hover:bg-gray-800 transition-colors">
                                                        Edit
                                                    </button>
                                                    <button onClick={() => handleDelete(car.id)} className="px-4 py-2 bg-gray-100 text-red-600 rounded font-medium hover:bg-red-50 transition-colors border border-gray-200">
                                                        Delete
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}

                                    {cars.length === 0 && (
                                        <div className="text-center py-12 text-gray-500 bg-gray-50 rounded-lg">
                                            No cars found. Open the menu to add one.
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* VIEW: ADD / EDIT CAR */}
                        {view === 'add' && (
                            <div className="max-w-lg mx-auto">
                                <h2 className="text-2xl font-bold mb-6">{editingCar ? 'Edit Vehicle' : 'Add New Vehicle'}</h2>
                                
                                <form onSubmit={handleSubmit} className="space-y-5 bg-white p-6 border border-gray-200 rounded-lg shadow-sm">
                                    {/* Image Preview inside form */}
                                    <div className="w-full h-48 bg-gray-100 rounded border border-gray-200 overflow-hidden flex items-center justify-center relative">
                                        {formData.imageUrl ? (
                                            <img src={formData.imageUrl} className="w-full h-full object-cover" alt="Preview" />
                                        ) : (
                                            <span className="text-gray-400">Image Preview</span>
                                        )}
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Image URL</label>
                                        <input 
                                            name="imageUrl" 
                                            value={formData.imageUrl} 
                                            onChange={handleChange} 
                                            placeholder="Paste image link here" 
                                            className="w-full p-3 bg-gray-50 border border-gray-300 rounded focus:border-black focus:ring-0 outline-none transition-colors"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Make</label>
                                            <input name="make" value={formData.make} onChange={handleChange} required className="w-full p-3 bg-gray-50 border border-gray-300 rounded focus:border-black focus:ring-0 outline-none" placeholder="BMW" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Model</label>
                                            <input name="model" value={formData.model} onChange={handleChange} required className="w-full p-3 bg-gray-50 border border-gray-300 rounded focus:border-black focus:ring-0 outline-none" placeholder="M4" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Year</label>
                                            <input name="year" type="number" value={formData.year} onChange={handleChange} required className="w-full p-3 bg-gray-50 border border-gray-300 rounded focus:border-black focus:ring-0 outline-none" placeholder="2023" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Price</label>
                                            <input name="price" type="number" value={formData.price} onChange={handleChange} required className="w-full p-3 bg-gray-50 border border-gray-300 rounded focus:border-black focus:ring-0 outline-none" placeholder="85000" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Status</label>
                                        <select name="status" value={formData.status} onChange={handleChange} className="w-full p-3 bg-gray-50 border border-gray-300 rounded focus:border-black focus:ring-0 outline-none">
                                            <option value="Available">Available</option>
                                            <option value="Sold">Sold</option>
                                            <option value="Reserved">Reserved</option>
                                        </select>
                                    </div>

                                    <button type="submit" className="w-full py-4 bg-black text-white font-bold rounded hover:bg-gray-800 transition-colors text-lg">
                                        {editingCar ? 'Update Car' : 'Add Car'}
                                    </button>
                                    
                                    {editingCar && (
                                        <button type="button" onClick={() => openView('inventory')} className="w-full py-3 text-gray-500 font-bold hover:text-black transition-colors">
                                            Cancel
                                        </button>
                                    )}
                                </form>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // --- AUTH ---
        function AuthScreen() {
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [error, setError] = React.useState(null);
            const [loading, setLoading] = React.useState(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError(null);
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (err) {
                    setError("Login failed. Check your credentials.");
                    setLoading(false);
                }
            };

            return (
                <div className="flex items-center justify-center min-h-screen p-4 bg-white">
                    <div className="w-full max-w-sm">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold tracking-tight mb-2">Black Iris</h1>
                            <p className="text-gray-500">Admin Portal</p>
                        </div>
                        {error && <div className="bg-red-50 text-red-600 p-3 rounded mb-4 text-sm text-center border border-red-100">{error}</div>}
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email" className="w-full p-4 bg-gray-50 border border-gray-300 rounded focus:border-black focus:ring-0 outline-none" required />
                            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Password" className="w-full p-4 bg-gray-50 border border-gray-300 rounded focus:border-black focus:ring-0 outline-none" required />
                            <button type="submit" disabled={loading} className="w-full bg-black text-white font-bold py-4 rounded hover:bg-gray-800 transition-colors">
                                {loading ? 'Checking...' : 'Enter'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function App() {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);

            React.useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (loading) return <div className="min-h-screen bg-white flex items-center justify-center"><div className="loader"></div></div>;

            return user ? <Dashboard user={user} /> : <AuthScreen />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
