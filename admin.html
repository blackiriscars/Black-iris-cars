<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Black Iris Fleet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #2563eb; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        
        /* CRITICAL FIX: Ensure hidden overlay never blocks clicks */
        .overlay-hidden { opacity: 0; pointer-events: none !important; z-index: -1 !important; }
    </style>
</head>
<body class="bg-gray-100 h-screen overflow-hidden">

    <!-- LOGIN OVERLAY -->
    <!-- Added transition for smoother exit, and ID for JS targeting -->
    <div id="login-overlay" class="fixed inset-0 bg-gray-900 z-[999] flex items-center justify-center transition-opacity duration-300">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md mx-4">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gray-200 rounded-full mx-auto mb-4 flex items-center justify-center border border-gray-300">
                    <i data-lucide="lock" class="w-8 h-8 text-gray-500"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Admin Login</h2>
                <p class="text-gray-500 text-sm">Authorized personnel only</p>
            </div>
            <form id="login-form" class="space-y-4">
                <input type="email" id="login-email" placeholder="Email" class="w-full p-3 border rounded-lg" required>
                <input type="password" id="login-password" placeholder="Password" class="w-full p-3 border rounded-lg" required>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition shadow-lg">Sign In</button>
                <p id="login-error" class="text-red-500 text-sm text-center hidden mt-2"></p>
            </form>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="flex h-screen hidden">
        
        <!-- Sidebar (Added ID 'main-sidebar' and mobile classes) -->
        <aside id="main-sidebar" class="w-64 bg-gray-900 text-white hidden md:flex flex-col fixed md:relative z-50 h-full transition-transform transform md:translate-x-0 -translate-x-full">
            <div class="p-6 text-2xl font-bold text-center border-b border-gray-700 flex justify-between md:justify-center items-center">
                <span>Black Iris</span>
                <!-- Close button for mobile only -->
                <button onclick="window.toggleSidebar()" class="md:hidden text-gray-400 hover:text-white">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <button id="nav-all-cars" onclick="window.switchTab('list')" class="w-full flex items-center px-4 py-3 bg-blue-600 text-white rounded-lg shadow-lg transition">
                    <i data-lucide="car" class="w-5 h-5 mr-3"></i> Fleet List
                </button>
                <button id="nav-add-car" onclick="window.resetForm()" class="w-full flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 rounded-lg transition">
                    <i data-lucide="plus-circle" class="w-5 h-5 mr-3"></i> Add/Edit Car
                </button>
            </nav>
            <div class="p-4 border-t border-gray-700 bg-gray-800">
                <button id="logout-btn" class="w-full flex items-center justify-center px-4 py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold transition shadow">
                    <i data-lucide="log-out" class="w-5 h-5 mr-2"></i> LOGOUT
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto relative bg-gray-50 w-full">
            <!-- Mobile Header (Added menu toggle logic) -->
            <header class="md:hidden bg-gray-900 text-white p-4 flex justify-between items-center sticky top-0 z-40 shadow-md">
                <div class="flex items-center gap-3">
                    <button onclick="window.toggleSidebar()" class="text-white hover:text-gray-300">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                    <span class="font-bold">Admin Panel</span>
                </div>
                <button id="mobile-logout" class="text-red-400"><i data-lucide="log-out" class="w-6 h-6"></i></button>
            </header>

            <!-- LIST VIEW -->
            <div id="view-all-cars" class="p-4 md:p-8 max-w-6xl mx-auto">
                <header class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Current Fleet</h2>
                    <button onclick="window.resetForm()" class="hidden md:block bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 shadow">+ Add New Car</button>
                </header>
                <div id="loading-cars" class="text-center py-20 text-gray-500"><div class="loader mx-auto mb-4"></div> Loading database...</div>
                <div id="cars-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-20"></div>
            </div>

            <!-- ADD/EDIT FORM -->
            <div id="view-add-car" class="p-4 md:p-8 max-w-5xl mx-auto" style="display: none;">
                <header class="flex justify-between items-center mb-6">
                    <h2 id="form-title" class="text-2xl font-bold text-gray-800">Add New Vehicle</h2>
                    <button onclick="window.switchTab('list')" class="text-gray-500 hover:text-gray-700 font-medium">Cancel</button>
                </header>

                <div class="bg-white rounded-xl shadow-lg p-6 md:p-8 border border-gray-100 mb-20">
                    <form id="add-car-form">
                        <input type="hidden" id="edit-doc-id"> <!-- Hidden ID for editing -->
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            
                            <!-- Left Column -->
                            <div class="space-y-6">
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">Car Name</label>
                                    <input type="text" id="car-name" placeholder="e.g. VW Touareg" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                </div>

                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-bold text-gray-700 mb-2">Price (DH/day)</label>
                                        <input type="number" id="car-price" placeholder="1400" required class="w-full p-3 border border-gray-300 rounded-lg">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-gray-700 mb-2">Seats</label>
                                        <input type="number" id="car-seats" placeholder="5" required class="w-full p-3 border border-gray-300 rounded-lg">
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">Car Model / Category</label>
                                    <select id="car-type" class="w-full p-3 border border-gray-300 rounded-lg bg-white">
                                        <option value="suv">SUV</option>
                                        <option value="sedan">Sedan</option>
                                        <option value="hatchback">Hatchback</option>
                                        <option value="luxury-suv">Luxury SUV</option>
                                        <option value="luxury-sedan">Luxury Sedan</option>
                                        <option value="van">Van / 7+ Seats</option>
                                    </select>
                                </div>

                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-bold text-gray-700 mb-2">Status</label>
                                        <select id="car-status" class="w-full p-3 border border-gray-300 rounded-lg bg-white font-medium text-gray-700">
                                            <option value="Available">✅ Available</option>
                                            <option value="Booked">🔴 Booked</option>
                                            <option value="Maintenance">⚠️ Maintenance</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-gray-700 mb-2">Fuel Type</label>
                                        <select id="car-fuel" class="w-full p-3 border border-gray-300 rounded-lg bg-white">
                                            <option value="Diesel">Diesel</option>
                                            <option value="Petrol">Petrol</option>
                                            <option value="Hybrid">Hybrid</option>
                                            <option value="Electric">Electric</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Hidden but required for website functionality -->
                                <div class="grid grid-cols-2 gap-4 bg-gray-50 p-3 rounded-lg border border-gray-200">
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 mb-1">Transmission</label>
                                        <select id="car-transmission" class="w-full p-2 border rounded text-sm bg-white"><option>Automatic</option><option>Manual</option></select>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-gray-500 mb-1">Color</label>
                                        <input type="text" id="car-color" placeholder="Black" class="w-full p-2 border rounded text-sm">
                                    </div>
                                </div>
                            </div>

                            <!-- Right Column -->
                            <div class="space-y-6">
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">Car Image Link</label>
                                    <div class="p-3 bg-blue-50 border border-blue-200 rounded text-xs text-blue-800 mb-2">
                                        Upload to <a href="https://postimages.org/" target="_blank" class="underline font-bold">PostImages.org</a> & paste "Direct Link".
                                    </div>
                                    <input type="url" id="car-image-url" placeholder="https://i.postimg.cc/..." required class="w-full p-3 border border-gray-300 rounded-lg">
                                </div>

                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">Description</label>
                                    <textarea id="car-desc" rows="5" placeholder="Full-size luxury SUV, offering ultimate comfort..." required class="w-full p-3 border border-gray-300 rounded-lg"></textarea>
                                </div>

                                <div class="pt-4">
                                    <button type="submit" id="save-btn" class="w-full bg-green-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-green-700 transition shadow-lg flex items-center justify-center text-lg">
                                        <span id="save-text">Publish Car</span>
                                        <div id="save-loader" class="loader ml-3 hidden border-white border-t-transparent"></div>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDo3yc_pj5vavuWDzOfm5QX1KURnqcF0vs",
          authDomain: "black-iris-fleet-9c64e.firebaseapp.com",
          projectId: "black-iris-fleet-9c64e",
          storageBucket: "black-iris-fleet-9c64e.firebasestorage.app",
          messagingSenderId: "875590751512",
          appId: "1:875590751512:web:7377b8c8fe507053f7ba6d",
          measurementId: "G-4Y7L69L9BS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Wrap icons in try/catch to prevent crashes
        try { lucide.createIcons(); } catch(e) { console.log("Icons loading..."); }

        let allCarsData = [];

        // --- AUTH & OVERLAY LOGIC (The Fix) ---
        onAuthStateChanged(auth, (user) => {
            const overlay = document.getElementById('login-overlay');
            const dashboard = document.getElementById('dashboard');

            if (user) {
                // FORCE hide the overlay and disable clicks on it
                overlay.classList.add('overlay-hidden');
                overlay.style.display = 'none'; 
                
                // Show dashboard
                dashboard.classList.remove('hidden');
                
                loadCars();
            } else {
                // Show overlay
                overlay.classList.remove('overlay-hidden');
                overlay.style.display = 'flex';
                
                // Hide dashboard
                dashboard.classList.add('hidden');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, 
                    document.getElementById('login-email').value, 
                    document.getElementById('login-password').value
                );
            } catch (err) {
                const errEl = document.getElementById('login-error');
                errEl.textContent = "Invalid login credentials.";
                errEl.classList.remove('hidden');
            }
        });

        const handleLogout = () => signOut(auth);
        document.getElementById('logout-btn').addEventListener('click', handleLogout);
        document.getElementById('mobile-logout').addEventListener('click', handleLogout);

        // --- MOBILE MENU LOGIC ---
        window.toggleSidebar = () => {
            const sidebar = document.getElementById('main-sidebar');
            const isHidden = sidebar.classList.contains('-translate-x-full');
            
            if (isHidden) {
                sidebar.classList.remove('hidden');
                // Small timeout to allow removing 'hidden' before animating
                setTimeout(() => sidebar.classList.remove('-translate-x-full'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                setTimeout(() => sidebar.classList.add('hidden'), 300);
            }
        }

        // --- TABS & EDITING ---
        window.switchTab = (tab) => {
            if (tab === 'list') {
                document.getElementById('view-all-cars').style.display = 'block';
                document.getElementById('view-add-car').style.display = 'none';
                
                // Close mobile menu if open
                const sidebar = document.getElementById('main-sidebar');
                if (!sidebar.classList.contains('-translate-x-full') && window.innerWidth < 768) {
                    window.toggleSidebar();
                }
                
                loadCars();
            } else {
                document.getElementById('view-all-cars').style.display = 'none';
                document.getElementById('view-add-car').style.display = 'block';
                
                 // Close mobile menu if open
                const sidebar = document.getElementById('main-sidebar');
                if (!sidebar.classList.contains('-translate-x-full') && window.innerWidth < 768) {
                    window.toggleSidebar();
                }
            }
        }

        window.resetForm = () => {
            document.getElementById('add-car-form').reset();
            document.getElementById('edit-doc-id').value = '';
            document.getElementById('form-title').textContent = 'Add New Vehicle';
            document.getElementById('save-text').textContent = 'Publish Car';
            document.getElementById('save-btn').classList.replace('bg-blue-600', 'bg-green-600');
            document.getElementById('save-btn').classList.replace('hover:bg-blue-700', 'hover:bg-green-700');
            window.switchTab('add');
        }

        // --- LOAD CARS ---
        async function loadCars() {
            const container = document.getElementById('cars-container');
            container.innerHTML = '';
            document.getElementById('loading-cars').classList.remove('hidden');
            
            try {
                const q = query(collection(db, "cars"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                document.getElementById('loading-cars').classList.add('hidden');
                allCarsData = [];

                if (querySnapshot.empty) {
                    container.innerHTML = '<p class="text-gray-500 col-span-3 text-center">No cars in fleet. Add one!</p>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const car = docSnap.data();
                    car.id = docSnap.id; 
                    allCarsData.push(car);

                    const div = document.createElement('div');
                    div.className = "bg-white p-4 rounded-lg shadow border border-gray-100 flex flex-col";
                    
                    const statusColor = car.status === 'Available' ? 'text-green-600' : 'text-red-600';
                    
                    div.innerHTML = `
                        <img src="${car.img}" class="w-full h-32 object-cover rounded mb-3 bg-gray-50" onerror="this.src='https://placehold.co/600x400?text=No+Image'">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-gray-800">${car.name}</h3>
                            <span class="text-xs font-bold ${statusColor} bg-gray-100 px-2 py-1 rounded">${car.status || 'Available'}</span>
                        </div>
                        <p class="text-sm text-gray-600">${car.price} DH / day</p>
                        <p class="text-xs text-gray-400 mt-1">${car.type} • ${car.fuel || 'Fuel N/A'}</p>
                        <div class="mt-auto pt-3 flex gap-2">
                            <button onclick="window.editCar('${car.id}')" class="flex-1 py-2 bg-blue-50 text-blue-600 rounded text-sm font-bold hover:bg-blue-100 border border-blue-200">
                                <i data-lucide="edit-2" class="w-4 h-4 inline mr-1"></i> Edit
                            </button>
                            <button onclick="window.deleteCar('${car.id}')" class="flex-1 py-2 bg-red-50 text-red-600 rounded text-sm font-bold hover:bg-red-100 border border-red-200">
                                <i data-lucide="trash" class="w-4 h-4 inline mr-1"></i> Delete
                            </button>
                        </div>
                    `;
                    container.appendChild(div);
                });
                lucide.createIcons();

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="col-span-3 text-center text-red-500">Error loading cars. Check console.</div>`;
            }
        }

        // --- EDIT & DELETE LOGIC (Attached to window explicitly) ---
        window.editCar = (id) => {
            const car = allCarsData.find(c => c.id === id);
            if(!car) return;

            // Populate Fields
            document.getElementById('edit-doc-id').value = id;
            document.getElementById('car-name').value = car.name;
            document.getElementById('car-price').value = car.price;
            document.getElementById('car-color').value = car.color || '';
            document.getElementById('car-transmission').value = car.transmission || 'Automatic';
            document.getElementById('car-seats').value = car.seats || 5;
            document.getElementById('car-type').value = car.type || 'suv';
            document.getElementById('car-status').value = car.status || 'Available';
            document.getElementById('car-fuel').value = car.fuel || 'Diesel';
            document.getElementById('car-image-url').value = car.img;
            document.getElementById('car-desc').value = car.desc;

            // Change UI to Edit Mode
            document.getElementById('form-title').textContent = 'Edit Vehicle';
            document.getElementById('save-text').textContent = 'Update Car';
            
            // Change button color to Blue to indicate Edit
            const btn = document.getElementById('save-btn');
            btn.classList.replace('bg-green-600', 'bg-blue-600');
            btn.classList.replace('hover:bg-green-700', 'hover:bg-blue-700');

            window.switchTab('add');
        }

        window.deleteCar = async (id) => {
            if(confirm("Are you sure you want to delete this car?")) {
                await deleteDoc(doc(db, "cars", id));
                loadCars();
            }
        }

        // --- SAVE LOGIC ---
        document.getElementById('add-car-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            const loader = document.getElementById('save-loader');
            const editId = document.getElementById('edit-doc-id').value;

            btn.disabled = true;
            loader.classList.remove('hidden');
            
            const carData = {
                name: document.getElementById('car-name').value,
                price: Number(document.getElementById('car-price').value),
                color: document.getElementById('car-color').value,
                transmission: document.getElementById('car-transmission').value,
                seats: Number(document.getElementById('car-seats').value),
                type: document.getElementById('car-type').value,
                status: document.getElementById('car-status').value,
                fuel: document.getElementById('car-fuel').value,
                img: document.getElementById('car-image-url').value,
                desc: document.getElementById('car-desc').value,
                createdAt: new Date() // You might want serverTimestamp() here but this works fine
            };

            try {
                if (editId) {
                    await updateDoc(doc(db, "cars", editId), carData);
                    alert("Car Updated Successfully!");
                } else {
                    await addDoc(collection(db, "cars"), carData);
                    alert("Car Published Successfully!");
                }
                window.resetForm();
                loadCars();
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
