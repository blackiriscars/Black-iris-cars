<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Iris Admin - Fleet Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Smooth scrolling for edit actions */
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="text-slate-100">

    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            doc, 
            onSnapshot,
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- ICONS ---
        const Icons = {
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>,
            Car: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a1 1 0 0 0-.8-.4H5.24a2 2 0 0 0-1.8 1.1l-.8 1.63A6 6 0 0 0 2 12a6 6 0 0 0 6 6h12a6 6 0 0 0 6-6c0-1.7-.13-2.6-.13-2.6a2 2 0 0 0-1.87-1.4z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
            Save: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        };

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyDo3yc_pj5vavuWDzOfm5QX1KURnqcF0vs",
            authDomain: "black-iris-fleet-9c64e.firebaseapp.com",
            projectId: "black-iris-fleet-9c64e",
            storageBucket: "black-iris-fleet-9c64e.firebasestorage.app",
            messagingSenderId: "875590751512",
            appId: "1:875590751512:web:7377b8c8fe507053f7ba6d",
            measurementId: "G-4Y7L69L9BS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- MAIN DASHBOARD COMPONENT ---
        function Dashboard({ user }) {
            const [cars, setCars] = React.useState([]);
            const [editingId, setEditingId] = React.useState(null);
            
            // Form State
            const [formData, setFormData] = React.useState({
                make: '', model: '', year: '', price: '', imageUrl: '', status: 'Available'
            });

            // 1. FETCH DATA
            React.useEffect(() => {
                const unsubscribe = onSnapshot(collection(db, "cars"), (snapshot) => {
                    const carList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setCars(carList);
                });
                return () => unsubscribe();
            }, []);

            // 2. FORM HANDLERS
            const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    if (editingId) {
                        await updateDoc(doc(db, "cars", editingId), { ...formData, updatedAt: serverTimestamp() });
                        setEditingId(null);
                    } else {
                        await addDoc(collection(db, "cars"), { ...formData, createdAt: serverTimestamp() });
                    }
                    // Reset Form
                    setFormData({ make: '', model: '', year: '', price: '', imageUrl: '', status: 'Available' });
                } catch (error) {
                    alert("Error: " + error.message);
                }
            };

            const handleEdit = (car) => {
                setEditingId(car.id);
                setFormData({ ...car });
                window.scrollTo({ top: 0, behavior: 'smooth' }); // Scroll to form
            };

            const handleCancelEdit = () => {
                setEditingId(null);
                setFormData({ make: '', model: '', year: '', price: '', imageUrl: '', status: 'Available' });
            };

            const handleDelete = async (id) => {
                if (confirm("Permanently delete this car?")) {
                    try {
                        await deleteDoc(doc(db, "cars", id));
                    } catch(err) {
                        alert("Could not delete: " + err.message);
                    }
                }
            };

            return (
                <div className="min-h-screen flex flex-col fade-in">
                    
                    {/* Top Navbar */}
                    <nav className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md sticky top-0 z-20">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600/20 p-2 rounded-lg border border-blue-500/30">
                                <span className="text-blue-500"><Icons.Car /></span>
                            </div>
                            <span className="font-bold text-lg tracking-tight text-white">Black Iris Admin</span>
                        </div>
                        <button onClick={() => signOut(auth)} className="text-slate-400 hover:text-white flex items-center gap-2 text-sm font-medium transition-colors">
                            <Icons.LogOut /> Sign Out
                        </button>
                    </nav>

                    <div className="flex-1 max-w-7xl mx-auto w-full p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
                        
                        {/* LEFT COLUMN: EDITOR (Sticky) */}
                        <div className="lg:col-span-1">
                            <div className="bg-slate-800 rounded-xl border border-slate-700 shadow-xl p-6 sticky top-24">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                                        {editingId ? <span className="text-yellow-400"><Icons.Edit/></span> : <span className="text-blue-400"><Icons.Plus/></span>}
                                        {editingId ? 'Edit Vehicle' : 'Add New Vehicle'}
                                    </h2>
                                    {editingId && (
                                        <button onClick={handleCancelEdit} className="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-300">
                                            Cancel
                                        </button>
                                    )}
                                </div>
                                
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    {/* Image Preview */}
                                    <div className="aspect-video bg-slate-900 rounded-lg overflow-hidden border border-slate-700 flex items-center justify-center mb-4 relative group">
                                        {formData.imageUrl ? (
                                            <img 
                                                src={formData.imageUrl} 
                                                alt="Preview" 
                                                className="w-full h-full object-cover"
                                                onError={(e) => e.target.style.display = 'none'} // Hide broken images
                                            />
                                        ) : (
                                            <span className="text-slate-600 text-sm">Image Preview</span>
                                        )}
                                        {/* Fallback text if image breaks or is missing */}
                                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none" style={{display: formData.imageUrl ? 'none' : 'flex'}}>
                                            <span className="text-slate-600 text-sm">No Image</span>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Image Link</label>
                                        <input 
                                            name="imageUrl" 
                                            value={formData.imageUrl} 
                                            onChange={handleChange} 
                                            placeholder="https://example.com/car.jpg" 
                                            className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-white text-sm focus:border-blue-500 outline-none transition-all" 
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Make</label>
                                            <input name="make" value={formData.make} onChange={handleChange} placeholder="BMW" required className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-white text-sm focus:border-blue-500 outline-none" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Model</label>
                                            <input name="model" value={formData.model} onChange={handleChange} placeholder="M4" required className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-white text-sm focus:border-blue-500 outline-none" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Year</label>
                                            <input name="year" type="number" value={formData.year} onChange={handleChange} placeholder="2023" required className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-white text-sm focus:border-blue-500 outline-none" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Price ($)</label>
                                            <input name="price" type="number" value={formData.price} onChange={handleChange} placeholder="85000" required className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-white text-sm focus:border-blue-500 outline-none" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 block">Status</label>
                                        <select name="status" value={formData.status} onChange={handleChange} className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-white text-sm focus:border-blue-500 outline-none">
                                            <option value="Available">Available</option>
                                            <option value="Sold">Sold</option>
                                            <option value="Reserved">Reserved</option>
                                        </select>
                                    </div>

                                    <button type="submit" className={`w-full py-3 rounded-lg font-bold text-white shadow-lg transition-all active:scale-[0.98] flex justify-center items-center gap-2 mt-4 ${editingId ? 'bg-yellow-600 hover:bg-yellow-500 shadow-yellow-600/20' : 'bg-blue-600 hover:bg-blue-500 shadow-blue-600/20'}`}>
                                        {editingId ? <><Icons.Save /> Update Car</> : <><Icons.Plus /> Add to Inventory</>}
                                    </button>
                                </form>
                            </div>
                        </div>

                        {/* RIGHT COLUMN: LIST */}
                        <div className="lg:col-span-2">
                             <div className="flex justify-between items-end mb-6">
                                <div>
                                    <h2 className="text-2xl font-bold text-white">Current Inventory</h2>
                                    <p className="text-slate-400 text-sm">Managing {cars.length} vehicles</p>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {cars.map(car => (
                                    <div key={car.id} className={`bg-slate-800 rounded-xl overflow-hidden border shadow-lg transition-all hover:shadow-xl group flex flex-col ${editingId === car.id ? 'border-yellow-500 ring-1 ring-yellow-500' : 'border-slate-700'}`}>
                                        
                                        {/* Image Area */}
                                        <div className="h-40 bg-slate-900 relative overflow-hidden border-b border-slate-700/50">
                                            {car.imageUrl ? (
                                                <img 
                                                    src={car.imageUrl} 
                                                    alt={`${car.make} ${car.model}`} 
                                                    className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                                                    onError={(e) => {
                                                        e.target.onerror = null; 
                                                        e.target.src = "https://placehold.co/600x400/1e293b/475569?text=No+Image";
                                                    }}
                                                />
                                            ) : (
                                                <div className="w-full h-full flex items-center justify-center text-slate-500 bg-slate-900">
                                                    <span className="text-sm">No Image Provided</span>
                                                </div>
                                            )}
                                            <div className="absolute top-2 right-2">
                                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider shadow-sm ${
                                                    car.status === 'Available' ? 'bg-green-500 text-white' : 
                                                    car.status === 'Sold' ? 'bg-red-500 text-white' : 'bg-orange-500 text-white'
                                                }`}>
                                                    {car.status}
                                                </span>
                                            </div>
                                        </div>

                                        {/* Content Area */}
                                        <div className="p-4 flex-1 flex flex-col">
                                            <div className="mb-3">
                                                <h3 className="font-bold text-white text-lg leading-tight">{car.year} {car.make} {car.model}</h3>
                                                <p className="text-blue-400 font-mono font-bold mt-1">${Number(car.price).toLocaleString()}</p>
                                            </div>
                                            
                                            <div className="mt-auto flex gap-2">
                                                <button 
                                                    onClick={() => handleEdit(car)}
                                                    className="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 py-2 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2"
                                                >
                                                    <Icons.Edit /> Edit
                                                </button>
                                                <button 
                                                    onClick={() => handleDelete(car.id)}
                                                    className="bg-red-500/10 hover:bg-red-500 hover:text-white text-red-500 px-3 rounded-lg transition-all flex items-center justify-center"
                                                    title="Delete"
                                                >
                                                    <Icons.Trash />
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}

                                {cars.length === 0 && (
                                    <div className="col-span-full py-12 text-center text-slate-500 border-2 border-dashed border-slate-700 rounded-xl bg-slate-800/30">
                                        <p>No cars found. Use the form to add one.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- LOGIN COMPONENT ---
        function AuthScreen() {
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [error, setError] = React.useState(null);
            const [loading, setLoading] = React.useState(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError(null);
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (err) {
                    setError("Invalid login details.");
                    setLoading(false);
                }
            };

            return (
                <div className="flex items-center justify-center min-h-screen p-4 bg-slate-900 fade-in">
                    <div className="w-full max-w-sm bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl">
                        <div className="text-center mb-6">
                            <h1 className="text-xl font-bold text-white">Admin Access</h1>
                            <p className="text-slate-500 text-xs mt-1">Authorized personnel only</p>
                        </div>
                        {error && <div className="bg-red-500/10 text-red-400 p-3 rounded-lg mb-4 text-xs text-center border border-red-500/20">{error}</div>}
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email" className="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white text-sm outline-none focus:border-blue-500" required />
                            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Password" className="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white text-sm outline-none focus:border-blue-500" required />
                            <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg text-sm transition-colors shadow-lg shadow-blue-600/20">
                                {loading ? '...' : 'Login'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- APP ROOT ---
        function App() {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);

            React.useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (loading) return <div className="min-h-screen bg-slate-900 flex items-center justify-center text-slate-500">Loading...</div>;

            return user ? <Dashboard user={user} /> : <AuthScreen />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
